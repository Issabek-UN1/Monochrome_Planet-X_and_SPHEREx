name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/smoke.py
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.production.yaml config --quiet
      - run: docker build -t monochrome-spherex:ci .
      - run: docker run -d --name spherex-web -e SPHEREX_PROVIDER=demo -e PORT=8787 monochrome-spherex:ci
      - run: docker exec spherex-web python scripts/smoke_deployment.py --url http://127.0.0.1:8787
      - run: docker stop --time 30 spherex-web
      - run: test "$(docker inspect -f '{{.State.ExitCode}}' spherex-web)" = "0"
      - if: always()
        run: docker logs spherex-web
      - if: always()
        run: docker rm -f spherex-web
  api-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - run: npm run check
      - run: git diff --exit-code -- src/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
      - run: npm run lint
