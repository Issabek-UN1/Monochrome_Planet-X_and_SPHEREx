[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "monochrome-spherex"
version = "0.1.0"
description = "SPHEREx sky exploration and time-domain imaging API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "astropy>=7,<9",
  "numpy>=2.2,<3",
  "pillow>=11,<14",
  "astropy-healpix>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
spherex-worker = "spherex.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/spherex"]

[tool.hatch.build.targets.sdist]
include = ["/backend/src", "/backend/tests", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint.isort]
known-first-party = ["spherex"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
